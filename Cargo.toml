[package]
name = "bumpus"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "A formally verified (Verus) bump allocator with typed and slice arenas"
repository = "https://github.com/elefthei/bumpus"
readme = "README.md"
keywords = ["allocator", "bump", "arena", "verus", "verified"]
categories = ["memory-management", "no-std"]

[dependencies]
vstd = { version = "=0.0.0-2026-10-04-0306", default-features = false, features = ["alloc"] }

[dev-dependencies]
criterion = "0.8"
bumpalo = "=3.20.3"
serde_json = "1"

[[bench]]
name = "bump"
harness = false

[package.metadata.verus]
verify = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(verus_only)', 'cfg(verus_keep_ghost)'] }
